network:
  version: 2
  renderer: networkd

  ethernets:
    ens3:
      dhcp4: false
      dhcp6: false
      link-local: []
    ens4:
      dhcp4: false
      dhcp6: false
      link-local: []
    ens5:
      dhcp4: false
      dhcp6: false
      link-local: []

  bonds:
    bond0:
      interfaces:
        - ens3
        - ens4
        - ens5
      addresses:
        - 192.168.10.10/24
      routes:
        - to: default
          via: 192.168.10.1
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8
      parameters:
        mode: active-backup
        primary: ens3
        mii-monitor-interval: 100
