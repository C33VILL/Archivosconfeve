# ============================ SERVER-1 ====================================
# /etc/netplan/01-fabric.yaml
network:
  version: 2
  renderer: networkd
  ethernets:
    ens3:
      addresses: [172.16.10.11/24]
      routes:
        - to: default
          via: 172.16.10.1
          metric: 100
    ens4:
      addresses: [172.16.20.11/24]
      routes:
        - to: default
          via: 172.16.20.1
          metric: 200
    ens5:
      addresses: [172.16.30.11/24]
      routes:
        - to: default
          via: 172.16.30.1
          metric: 300
 
