network:
  version: 2
  renderer: networkd

  ethernets:
    ens160:
      dhcp4: false
      dhcp6: false

    ens192:
      dhcp4: false
      dhcp6: false

  bonds:
    bond0:
      interfaces:
        - ens3 
        - ens4 

      addresses:
        - 192.168.10.10/24

      routes:
        - to: default
          via: 192.168.10.1

      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8

      parameters:
        mode: active-backup
        primary: ens160
        mii-monitor-interval: 100
